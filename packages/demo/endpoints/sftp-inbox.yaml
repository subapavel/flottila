# The SFTP drop of the compose stack (deploy/compose): service `sftp`, user demo, directory inbox (the server chroots demo to
# /home/demo, so the session sees /inbox). A deployed endpoint's URI is only sftp://<id>, so host, port and dir are options (D-086, F-19).
# Password and host key are references: the node reads FLOTTILA_SECRET_SFTP_PASSWORD and FLOTTILA_SECRET_SFTP_HOST_KEY; the host
# key's fingerprint is generated by the stack's sftp-keys one-shot at its first start, nothing secret or generated is in the repo.
schemaVersion: 1
kind: endpoint
id: sftp-inbox
scheme: sftp
direction: in
config:
  host: sftp
  port: 22
  dir: /inbox
  user: demo
  password: secret://sftp-password
  hostKey: secret://sftp-host-key
  afterSuccess: delete
