# sftp-invoice (at-least-once): the sftp mock feeds the files under fixtures/inbox (no send, an SFTP door has no answer); the partner
# gets the transformed invoice once; a partner that keeps failing 503 parks the message in the DLQ after the retries.
schemaVersion: 1
kind: test
flow: sftp-invoice
mocks:
  sftp-inbox: { files: fixtures/inbox/*.xml }
  partner-domestic: { reply: fixtures/partner-ack.xml, delay: 20ms }
cases:
  - name: invoice file
    expect:
      sent:
        partner-domestic: { count: 1, xpath: /PartnerInvoice/@number, equals: "4711" }
      keys: { invoiceId: "4711" }
      dlq: 0
  - name: partner down
    mocks:
      partner-domestic: { fail: 503 }
    expect: { dlq: 1, retries: 3 }
