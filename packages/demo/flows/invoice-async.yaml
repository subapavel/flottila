# invoice-sync's twin at-least-once (D-075): the invoice is saved and queued under its invoiceId, the sender gets 202 after the durable
# save and a worker sends it on through the Postgres work queue, one invoice of an id at a time, in accept order. A partner that keeps
# failing parks the message in the DLQ after the retries. Its own door (http-in-async, :8082): two http endpoints cannot share a port.
schemaVersion: 1
kind: flow
id: invoice-async
version: 0.1.0
description: Validate an invoice, accept it, then route by currency, map it for the partner and send it on in invoice order.
from:
  endpoint: http-in-async
delivery:
  mode: at-least-once
  saveTimeout: 5s
  queue: postgres
recording:
  level: all
  payload: keep
limits:
  maxBodyBytes: 1048576
  maxInFlight: 16
  maxInFlightBytes: 16777216
partitionBy: invoiceId
forwardHeaders: [Content-Type, X-Request-Id]
retry:
  attempts: 3
  initial: 100ms
  max: 2s
steps:
  - type: xsd
    name: validate
    schema: flows/invoice.xsd
  - type: extractKey
    name: extractKey
    key: invoiceId
    xpath: /Invoice/Id
  - type: route
    name: route
    prop: PARTNER
    routes:
      - when: "/Invoice/Currency = 'CZK'"
        set: domestic
    otherwise: foreign
  - type: xslt
    name: toPartner
    stylesheet: flows/invoice-to-partner.xsl
  - type: to
    name: partner
    retryable: true
    byProp: PARTNER
    endpoints:
      domestic: partner-domestic
      foreign: partner-foreign
