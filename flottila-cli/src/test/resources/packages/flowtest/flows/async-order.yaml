# At-least-once: the sender gets 202 at once; the worker keys the order and sends it to the partner (retryable); a send that
# fails every retry parks the message in the DLQ.
schemaVersion: 1
kind: flow
id: async-order
version: 0.1.0
description: Accept the order, then key it and send it to the partner.
from:
  endpoint: in-async
delivery:
  mode: at-least-once
recording:
  level: all
  payload: keep
limits:
  maxBodyBytes: 1048576
  maxInFlight: 16
  maxInFlightBytes: 16777216
retry:
  attempts: 3
  initial: 100ms
  max: 2s
steps:
  - type: extractKey
    name: extractKey
    key: orderId
    xpath: /Order/Id
  - type: to
    name: partner
    retryable: true
    endpoint: partner
