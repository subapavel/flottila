# The partner-down case runs first: the happy path after it sees nothing of it (a fresh runtime, mocks and stores per case).
# Partner down: two runs (the first and the one scheduled retry, delivery.retries) of 4 sends each (1 + 3 step retries); retries
# counts the 3 + 3 step retries and the 1 rerun; flow time 700 ms + 1 s + 700 ms = 2400ms.
schemaVersion: 1
kind: test
flow: async-order
mocks:
  partner: { reply: fixtures/ack.xml, delay: 250ms }
cases:
  - name: partner down
    send: fixtures/order.xml
    mocks:
      partner: { fail: 503 }
    expect:
      status: 202
      dlq: 1
      retries: 7
      sent:
        partner: { count: 8 }
  - name: happy path
    send: fixtures/order.xml
    expect:
      status: 202
      steps: 3
      keys: { orderId: "42" }
      dlq: 0
      retries: 0
      sent:
        partner: { count: 1, xpath: /Order/Id, equals: "42" }
