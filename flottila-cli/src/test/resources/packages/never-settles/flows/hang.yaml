# Sync: the answer is the slow partner's reply.
schemaVersion: 1
kind: flow
id: hang
version: 0.1.0
description: Send the request to a slow partner and answer with its reply.
from:
  endpoint: in
delivery:
  mode: sync
limits:
  maxBodyBytes: 1048576
  maxInFlight: 4
  maxInFlightBytes: 4194304
steps:
  - type: to
    name: slow
    endpoint: slow
