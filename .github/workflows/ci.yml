# The platform's checks on GitHub.
# On every pull request: the sign-off check of every commit. It blocks a merge. The session that wrote the change
# runs the build with its tests itself before it merges.
# Once a day and on demand, before the owner's morning overview: the build of main with unit and integration
# tests on the pinned Postgres, Error Prone, the name guard, the change guard and the demo package, and then the
# whole stack started in Docker with the demo deployed, and the quickstart's first-run and start commands run as
# written (node, mapping service and UI, an invoice found), and the adapter kit's commands run as docs/ADAPTERS.md writes
# them (a new adapter built and tested, run with a node and the UI, a test message sent through it and found). It blocks
# nothing; a red run is the first task of the day.
# The larger reports (the oldest supported Postgres, coverage, the benchmark, mutation testing and the fork kill
# check) are switched off for now.
name: ci

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'

env:
  JAVA_VERSION: '25'
  MAVEN_OPTS: -Xmx3g

jobs:
  dco:
    name: DCO sign-off on every commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            range="${{ github.event.before }}..${{ github.sha }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            # the checkout is the synthetic merge commit, which carries no sign-off
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            range="HEAD~1..HEAD"
          fi
          missing=0
          # Only the commits on the first-parent line are checked, merge commits included. The commits a merge
          # brings in through its second parent are not: the imported mapping engine has 131 commits without
          # the trailer.
          for c in $(git rev-list --first-parent "$range"); do
            if ! git log -n 1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "::error::commit $c has no Signed-off-by trailer"; missing=1
            fi
          done
          [ "$missing" = 0 ]

  build:
    name: "build · unit · integration (-Pit) · ArchUnit"
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # References to tasks or decisions in comments, and colours written by hand instead of PatternFly tokens, on
      # the lines this change adds or modifies: compared with the pull request's base, with the previous main for
      # a push, else with the parent commit. In the folders whose comments have been cleaned (CLEANED in
      # ci/change_guard.py) every comment is checked for references, changed or not.
      - name: Change guard on the added and modified lines, and its tests
        run: |
          set -euo pipefail
          python3 -m unittest ci.test_change_guard
          base=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base="${{ github.event.before }}"
          fi
          if [ -n "$base" ]; then
            git fetch -q --no-tags --depth=1 origin "$base"
          else
            git fetch -q --no-tags --deepen=1 origin "$GITHUB_SHA"
            base="HEAD~1"
          fi
          python3 ci/change_guard.py --base "$base"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Install the jq engine the jq step depends on (its tests run in jq-ci)
        run: bin/install-jq
      - name: Install the mapping engine the mapping step depends on (its tests run in mapping-ci)
        run: bin/install-mapping
      # jacoco.skip: coverage is measured only in the nightly coverage job, so a fall in coverage never blocks a change.
      # -T 1C: modules that do not depend on each other build at the same time; inside a module the test classes are spread
      # over one test JVM per core (rail8.test.forks in platform/pom.xml).
      - name: Verify (unit tests, integration tests with Testcontainers, ArchUnit)
        run: mvn -B -ntp -T 1C -f platform/pom.xml verify -Pit -Djacoco.skip=true
      - name: The demo package validates through the launcher
        run: bin/rail8 validate examples/demo
      - name: The demo package's flow tests pass through the launcher
        run: bin/rail8 test examples/demo
      # The verify above built the sample plugin's jar into examples/webhook-plugin/target/plugin
      - name: The sample plugin's package validates and its flow tests pass through the launcher, with the plugin
        run: |
          set -euo pipefail
          bin/rail8 validate --plugins examples/webhook-plugin/target/plugin examples/webhook-plugin/package
          bin/rail8 test --plugins examples/webhook-plugin/target/plugin examples/webhook-plugin/package
      - name: Script tests (coverage check, name guard, comment-only check, fork kill check, site checks) and the name guard itself
        run: |
          set -euo pipefail
          python3 -m unittest ci.test_coverage_check
          python3 -m unittest ci.test_comment_only_check
          python3 -m unittest ci.test_fork_kill_check
          python3 -m unittest ci.test_name_guard
          python3 ci/name_guard.py
          python3 -m unittest ci.test_site
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
          if-no-files-found: ignore

  postgres-floor:
    name: "nightly · unit · integration (-Pit) · Postgres 17.11, the oldest supported"
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Install the jq engine the jq step depends on (its tests run in jq-ci)
        run: bin/install-jq
      - name: Install the mapping engine the mapping step depends on (its tests run in mapping-ci)
        run: bin/install-mapping
      - name: Verify on Postgres 17.11
        run: mvn -B -ntp -f platform/pom.xml verify -Pit -Djacoco.skip=true -Drail8.it.postgres=postgres:17.11

  coverage:
    name: "nightly · coverage floors and the comparison with ci/coverage-baseline.json"
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Install the jq engine the jq step depends on (its tests run in jq-ci)
        run: bin/install-jq
      - name: Install the mapping engine the mapping step depends on (its tests run in mapping-ci)
        run: bin/install-mapping
      # The floors of platform/pom.xml (90 % for api and core, 75 % elsewhere) fail this job when missed.
      - name: Verify with the coverage floors
        run: mvn -B -ntp -f platform/pom.xml verify -Pit
      # Compares this night's coverage with the committed ci/coverage-baseline.json and reports any fall.
      - name: Coverage compared with the committed baseline
        if: always()
        run: python3 ci/coverage_check.py --baseline-ref HEAD
      - name: Coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: '**/target/site/jacoco/jacoco.xml'
          if-no-files-found: ignore

  stack:
    name: "nightly · stack (deploy/compose: up, /health within 60 s, deploy exit 0, demo listed)"
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    env:
      RAIL8_ADMIN_TOKEN: ci-stack-token
      RAIL8_S3_SECRET_KEY: ci-stack-s3-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Install the jq engine the jq step depends on (its tests run in jq-ci)
        run: bin/install-jq
      - name: Install the mapping engine the mapping step depends on (its tests run in mapping-ci)
        run: bin/install-mapping
      - name: Build the jars the node image and the deploy one-shot use
        run: mvn -B -ntp -q -f platform/pom.xml package -DskipTests -pl :rail8-node,:rail8-cli -am
      - name: Start the stack and wait for /health (60 s bound)
        working-directory: deploy/compose
        run: |
          set -euo pipefail
          docker compose up -d --build
          start=$(date +%s)
          until curl -sf localhost:8081/health > /dev/null; do
            if [ $(( $(date +%s) - start )) -ge 60 ]; then echo "::error::/health not green within 60 s of up"; exit 1; fi
            sleep 1
          done
          echo "seconds from up to /health green: $(( $(date +%s) - start ))"
      - name: The deploy one-shot exited 0 and the demo is listed
        working-directory: deploy/compose
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            [ "$(docker compose ps -a deploy --format '{{.State}}')" = exited ] && break
            sleep 1
          done
          code=$(docker compose ps -a deploy --format '{{.ExitCode}}')
          [ "$code" = 0 ] || { echo "::error::deploy exited $code"; docker compose logs deploy; exit 1; }
          curl -sf -H "Authorization: Bearer $RAIL8_ADMIN_TOKEN" localhost:8081/admin/packages | grep -q '"name":"demo"'
      - name: Stack logs on failure
        if: failure()
        working-directory: deploy/compose
        run: docker compose logs --no-color | tail -200
      - name: Tear down
        if: always()
        working-directory: deploy/compose
        run: docker compose --profile history --profile kafka down -v

  quickstart:
    name: "nightly · quickstart (docs/QUICKSTART.md: first-run commands, node, mapping service and UI started, an invoice found)"
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      RAIL8_ADMIN_TOKEN: rail8-local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # The commands of the quickstart's first run, in its order.
      - name: Install the engines, build the node's jar and the mapping service, install the UI
        run: |
          set -euo pipefail
          bin/install-jq && bin/install-mapping
          mvn -B -ntp -q -f platform/pom.xml package -DskipTests -pl :rail8-node -am
          ./mvnw -B -ntp -q -f mapping/pom.xml -pl service -am package -DskipTests
          (cd ui && npm ci)
      - name: Start the node, wait for /health and deploy the demo
        run: |
          set -euo pipefail
          docker compose up -d --build
          start=$(date +%s)
          until curl -sf localhost:8081/health > /dev/null; do
            if [ $(( $(date +%s) - start )) -ge 120 ]; then echo "::error::/health not green within 120 s of up"; exit 1; fi
            sleep 2
          done
          deploy/quickstart/deploy.sh examples/demo
      - name: Start the mapping service and the UI as the quickstart does
        run: |
          set -euo pipefail
          cp -r mapping/corpus ~/rail8-mapping-workspace
          nohup java -Dquarkus.http.port=18080 -Drail8.mapping.workspace=$HOME/rail8-mapping-workspace -jar mapping/service/target/quarkus-app/quarkus-run.jar > "$RUNNER_TEMP/mapping.log" 2>&1 &
          mkdir -p ~/rail8-workspace && cp -r examples/demo ~/rail8-workspace/demo
          (cd ui && QUARKUS_HTTP_PORT=18080 RAIL8_WORKSPACE=$HOME/rail8-workspace nohup npm run dev > "$RUNNER_TEMP/ui.log" 2>&1 &)
          for url in localhost:18080/api/mappings localhost:5173/; do
            start=$(date +%s)
            until curl -sf "$url" > /dev/null; do
              if [ $(( $(date +%s) - start )) -ge 90 ]; then echo "::error::$url not answering within 90 s"; exit 1; fi
              sleep 2
            done
          done
      - name: An invoice is sent in and found through the UI's server
        run: |
          set -euo pipefail
          reply=$(curl -sf -X POST --data-binary @examples/demo/fixtures/sample-invoice.xml -H 'Content-Type: application/xml' localhost:8080/in)
          echo "$reply"
          echo "$reply" | grep -q '<PartnerInvoice number="4711" currency="CZK"'
          # the UI's server adds the token itself; the Sec-Fetch-Site header stands in for the browser's own page
          for _ in $(seq 1 30); do
            found=$(curl -sf -H 'Sec-Fetch-Site: same-origin' 'localhost:5173/admin/messages?key=invoiceId:4711' || true)
            echo "$found" | grep -q '"items":\["' && exit 0
            sleep 2
          done
          echo "::error::the invoice was not found through the UI's /admin: $found"; exit 1
      - name: Logs on failure
        if: failure()
        run: |
          docker compose logs --no-color | tail -200
          tail -100 "$RUNNER_TEMP/mapping.log" "$RUNNER_TEMP/ui.log" || true
      - name: Tear down
        if: always()
        run: docker compose down -v

  adapter-kit:
    name: "nightly · adapter kit (docs/ADAPTERS.md: a new adapter built and tested, run with the UI, a test message found)"
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # The commands of docs/ADAPTERS.md, in its order.
      - name: Build the kit, create an adapter, run its tests
        run: |
          set -euo pipefail
          bin/install-jq && bin/install-mapping
          mvn -B -ntp -q -f platform/pom.xml install -DskipTests -pl :rail8-cli -am
          (cd ui && npm ci)
          bin/rail8 new-adapter ~/acme-adapter --scheme acme --package com.acme.rail8
          mvn -B -ntp -q -f ~/acme-adapter/pom.xml verify
          bin/rail8 validate --plugins ~/acme-adapter/target/plugin ~/acme-adapter/package
          bin/rail8 test --plugins ~/acme-adapter/target/plugin ~/acme-adapter/package
      - name: Run it with the UI, send a test message through it and find it
        run: |
          set -euo pipefail
          nohup bin/run-adapter ~/acme-adapter > "$RUNNER_TEMP/run-adapter.log" 2>&1 &
          start=$(date +%s)
          until grep -q 'Ctrl+C stops everything' "$RUNNER_TEMP/run-adapter.log"; do
            if [ $(( $(date +%s) - start )) -ge 300 ]; then echo "::error::bin/run-adapter not running within 300 s"; exit 1; fi
            sleep 2
          done
          # the UI's server answers for the node; the Sec-Fetch-Site header stands in for the browser's own page
          ui() { curl -sf -H 'Sec-Fetch-Site: same-origin' "localhost:5173$1"; }
          components=$(ui /admin/components)
          echo "$components" | grep -q '"scheme":"acme"'
          endpoints=$(ui /files/endpoints)
          echo "$endpoints" | grep -q '"path":"package/endpoints/orders-in.yaml"'
          reply=$(curl -sf -X POST --data-binary @"$HOME/acme-adapter/package/fixtures/order.xml" -H 'Content-Type: application/xml' localhost:18090/orders)
          echo "$reply"
          [ "$reply" = '<Order><Id>7</Id></Order>' ]
          for _ in $(seq 1 30); do
            found=$(ui '/admin/messages?key=orderId:7' || true)
            echo "$found" | grep -q '"items":\["' && exit 0
            sleep 2
          done
          echo "::error::the test message was not found through the UI's /admin: $found"; exit 1
      - name: Logs on failure
        if: failure()
        run: tail -100 "$RUNNER_TEMP/run-adapter.log" ~/acme-adapter/target/run-adapter/*.log || true

  fork-kill:
    name: "nightly · a test JVM that dies fails the build, in every module (ci/fork_kill_check.py)"
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Install the jq engine the jq step depends on
        run: bin/install-jq
      # Each reactor is checked even when an earlier one has a finding.
      - name: The platform's unit test JVMs
        if: ${{ !cancelled() }}
        run: python3 ci/fork_kill_check.py platform/pom.xml
      # A module stops at its first failed goal, so the integration test JVMs are killed with the unit tests deselected.
      - name: The platform's integration test JVMs (-Pit)
        if: ${{ !cancelled() }}
        run: python3 ci/fork_kill_check.py platform/pom.xml -Pit -Dtest=NoUnitTest -Dsurefire.failIfNoSpecifiedTests=false
      - name: The jq engine's test JVMs
        if: ${{ !cancelled() }}
        run: python3 ci/fork_kill_check.py jq/pom.xml
      - name: The mapping's test JVMs
        if: ${{ !cancelled() }}
        run: python3 ci/fork_kill_check.py mapping/pom.xml

  bench:
    name: bench (native Postgres on the runner)
    if: false
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Start native Postgres
        # the runner's packaged Postgres, deliberately not pinned to PostgresImage (D-129): its version is recorded with the
        # numbers in bench/RESULTS.md; the bench ITs in the build job run on the pinned image
        run: |
          sudo systemctl start postgresql
          # CREATEDB: bench/run.sh creates the rail8_bench database itself
          sudo -u postgres psql -c "CREATE ROLE rail8 LOGIN CREATEDB PASSWORD 'rail8';"
          sudo -u postgres psql -c "CREATE DATABASE rail8 OWNER rail8;"
      - name: Install the jq engine the jq step depends on (its tests run in jq-ci)
        run: bin/install-jq
      - name: Install the mapping engine the mapping step depends on (its tests run in mapping-ci)
        run: bin/install-mapping
      - name: Run the harness (bench/run.sh from P0-10; fails on a > 20 % regression once a baseline exists)
        run: |
          bench/run.sh
        env:
          BENCH_MACHINE: github-hosted runner   # compared only with a baseline of this label (D-037); VM numbers never apply here
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench/out/
          if-no-files-found: ignore

  mutation:
    name: mutation (PIT, api + core)
    if: false
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      # Scoped to api + core: -DskipTests would make pitest-maven skip silently, so tests are compiled
      # the normal way; the ≥ 80 % threshold (platform/pom.xml) fails the job below the floor.
      - name: PIT on api and core
        run: mvn -B -ntp -f platform/pom.xml -pl :rail8-api,:rail8-core -am test-compile org.pitest:pitest-maven:mutationCoverage
      - uses: actions/upload-artifact@v4
        with:
          name: pit-reports
          path: '**/target/pit-reports/**'
          if-no-files-found: ignore
