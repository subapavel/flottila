# CI gates — docs/WORKFLOW.md §4. Every push to main runs dco and build (unit + Testcontainers
# integration tests in one job, so the coverage floors count the ITs — D-030); bench and mutation
# run nightly and on demand (workflow_dispatch).
# build: JaCoCo floors halt `mvn verify` (root pom), ci/coverage_check.py refuses a decrease beyond
# the 2 pp noise band (D-029) against the baseline committed at the previous main commit. bench: bench/run.sh (P0-10) exits
# non-zero on a > 20 % regression against bench/RESULTS.md. mutation: PIT on api + core.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'

env:
  JAVA_VERSION: '25'
  MAVEN_OPTS: -Xmx3g

jobs:
  dco:
    name: DCO sign-off on every commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            range="${{ github.event.before }}..${{ github.sha }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            # the checkout is the synthetic merge commit, which carries no sign-off
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            range="HEAD~1..HEAD"
          fi
          missing=0
          for c in $(git rev-list "$range"); do
            if ! git log -n 1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "::error::commit $c has no Signed-off-by trailer"; missing=1
            fi
          done
          [ "$missing" = 0 ]

  build:
    name: build · unit · integration (-Pit) · ArchUnit · coverage floors · no-decrease
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: flottila
          POSTGRES_USER: flottila
          POSTGRES_PASSWORD: flottila
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U flottila -d flottila"
          --health-interval 2s --health-timeout 2s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Apply schema (until P0-08 moves this into Flyway)
        if: hashFiles('db/init.sql') != ''
        run: PGPASSWORD=flottila psql -h localhost -U flottila -d flottila -v ON_ERROR_STOP=1 -f db/init.sql
      - name: Verify (unit + Testcontainers ITs, ArchUnit, JaCoCo floors incl. the ITs)
        run: mvn -B -ntp verify -Pit
      - name: Coverage gate self-test
        run: python3 -m unittest ci.test_coverage_check
      - name: Coverage no-decrease against the previous main commit
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          ref="HEAD"
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git fetch -q origin "$BEFORE" || { echo "::error::cannot fetch the previous commit $BEFORE"; exit 1; }
            ref="$BEFORE"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch -q origin "${{ github.base_ref }}" || { echo "::error::cannot fetch ${{ github.base_ref }}"; exit 1; }
            ref="FETCH_HEAD"
          fi
          echo "baseline from $ref"
          python3 ci/coverage_check.py --baseline-ref "$ref"
      - name: "Committed baseline describes this commit (D-018/D-029: every task commit runs --write; ±2 pp noise band)"
        run: python3 ci/coverage_check.py --check-baseline
      - name: Test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
            **/target/site/jacoco/jacoco.xml
          if-no-files-found: ignore

  bench:
    name: bench (native Postgres on the runner)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Start native Postgres
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE ROLE flottila LOGIN PASSWORD 'flottila';"
          sudo -u postgres psql -c "CREATE DATABASE flottila OWNER flottila;"
      - name: Run the harness (bench/run.sh from P0-10; fails on a > 20 % regression once a baseline exists)
        run: |
          if [ -x bench/run.sh ]; then bench/run.sh; else echo "no bench/run.sh yet (P0-10)"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench/out/
          if-no-files-found: ignore

  mutation:
    name: mutation (PIT, api + core)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      # Scoped to api + core: -DskipTests would make pitest-maven skip silently, so tests are compiled
      # the normal way; the ≥ 80 % threshold (root pom) fails the job below the floor.
      - name: PIT on api and core
        run: mvn -B -ntp -pl flottila-api,flottila-core -am test-compile org.pitest:pitest-maven:mutationCoverage
      - uses: actions/upload-artifact@v4
        with:
          name: pit-reports
          path: '**/target/pit-reports/**'
          if-no-files-found: ignore
