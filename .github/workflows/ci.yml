# CI gates — docs/WORKFLOW.md §4. Every push to main runs dco and build (unit + Testcontainers
# integration tests in one job, so the coverage floors count the ITs — D-030); bench and mutation
# run nightly and on demand (workflow_dispatch).
# build: JaCoCo floors halt `mvn verify` (platform/pom.xml), ci/coverage_check.py refuses a decrease beyond
# the 2 pp noise band (D-029) against the baseline committed at the previous main commit. bench: bench/run.sh (P0-10) exits
# non-zero on a > 20 % regression against bench/RESULTS.md. mutation: PIT on api + core.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'

env:
  JAVA_VERSION: '25'
  MAVEN_OPTS: -Xmx3g

jobs:
  dco:
    name: DCO sign-off on every commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            range="${{ github.event.before }}..${{ github.sha }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            # the checkout is the synthetic merge commit, which carries no sign-off
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            range="HEAD~1..HEAD"
          fi
          missing=0
          # First parent only (D-150): the commits on this branch's first-parent line are checked, merge
          # commits included; the commits a merge brings in by a later parent are not, whatever their
          # origin. The reason is the import of the mapping engine: 131 of its commits have no trailer.
          for c in $(git rev-list --first-parent "$range"); do
            if ! git log -n 1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "::error::commit $c has no Signed-off-by trailer"; missing=1
            fi
          done
          [ "$missing" = 0 ]

  build:
    name: "build · unit · integration (-Pit) · ArchUnit · coverage floors · no-decrease · Postgres ${{ matrix.postgres }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # D-129: supported Postgres 17 and 18. main runs the pinned PostgresImage.NAME (postgres:18.6) and every gate below;
        # floor runs the same -Pit suite on the supported floor through the rail8.it.postgres property, tests only.
        # postgres:19 joins after its GA (FIX-169b), never an RC image.
        include:
          - postgres: main 18.6
            image-args: ''
          - postgres: floor 17.11
            image-args: -Drail8.it.postgres=postgres:17.11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Verify (unit + Testcontainers ITs, ArchUnit, JaCoCo floors incl. the ITs)
        # -f platform/pom.xml: the root aggregator also lists mapping/ (BRAND-3, D-150), which this job does not build.
        run: mvn -B -ntp -f platform/pom.xml verify -Pit ${{ matrix.image-args }}
      - name: The demo package validates through the launcher (D-079)
        if: matrix.image-args == ''
        run: bin/rail8 validate examples/demo
      - name: The demo package's flow tests pass through the launcher (D-080)
        if: matrix.image-args == ''
        run: bin/rail8 test examples/demo
      - name: Coverage gate self-test
        if: matrix.image-args == ''
        run: python3 -m unittest ci.test_coverage_check
      - name: The old product name does not come back (BRAND-4, D-148/D-149; guard self-test, then the guard)
        if: matrix.image-args == ''
        run: |
          set -euo pipefail
          python3 -m unittest ci.test_name_guard
          python3 ci/name_guard.py
      - name: Coverage no-decrease against the previous main commit
        if: matrix.image-args == ''
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          ref="HEAD"
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git fetch -q origin "$BEFORE" || { echo "::error::cannot fetch the previous commit $BEFORE"; exit 1; }
            ref="$BEFORE"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch -q origin "${{ github.base_ref }}" || { echo "::error::cannot fetch ${{ github.base_ref }}"; exit 1; }
            ref="FETCH_HEAD"
          fi
          echo "baseline from $ref"
          python3 ci/coverage_check.py --baseline-ref "$ref"
      - name: "Committed baseline describes this commit (D-018/D-029: every task commit runs --write; ±2 pp noise band)"
        if: matrix.image-args == ''
        run: python3 ci/coverage_check.py --check-baseline
      - name: Test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ strategy.job-index }}
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
            **/target/site/jacoco/jacoco.xml
          if-no-files-found: ignore

  stack:
    name: "stack (deploy/compose: up, /health within 60 s, deploy exit 0, demo listed)"
    needs: build
    runs-on: ubuntu-latest
    env:
      RAIL8_ADMIN_TOKEN: ci-stack-token
      RAIL8_S3_SECRET_KEY: ci-stack-s3-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Build the jars the node image and the deploy one-shot use
        run: mvn -B -ntp -q -f platform/pom.xml package -DskipTests -pl :rail8-runtime,:rail8-cli -am
      - name: Start the stack and wait for /health (60 s bound)
        working-directory: deploy/compose
        run: |
          set -euo pipefail
          docker compose up -d --build
          start=$(date +%s)
          until curl -sf localhost:8081/health > /dev/null; do
            if [ $(( $(date +%s) - start )) -ge 60 ]; then echo "::error::/health not green within 60 s of up"; exit 1; fi
            sleep 1
          done
          echo "seconds from up to /health green: $(( $(date +%s) - start ))"
      - name: The deploy one-shot exited 0 and the demo is listed
        working-directory: deploy/compose
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            [ "$(docker compose ps -a deploy --format '{{.State}}')" = exited ] && break
            sleep 1
          done
          code=$(docker compose ps -a deploy --format '{{.ExitCode}}')
          [ "$code" = 0 ] || { echo "::error::deploy exited $code"; docker compose logs deploy; exit 1; }
          curl -sf -H "Authorization: Bearer $RAIL8_ADMIN_TOKEN" localhost:8081/admin/packages | grep -q '"name":"demo"'
      - name: Stack logs on failure
        if: failure()
        working-directory: deploy/compose
        run: docker compose logs --no-color | tail -200
      - name: Tear down
        if: always()
        working-directory: deploy/compose
        run: docker compose --profile history --profile kafka down -v

  bench:
    name: bench (native Postgres on the runner)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Start native Postgres
        # the runner's packaged Postgres, deliberately not pinned to PostgresImage (D-129): its version is recorded with the
        # numbers in bench/RESULTS.md; the bench ITs in the build job run on the pinned image
        run: |
          sudo systemctl start postgresql
          # CREATEDB: bench/run.sh creates the rail8_bench database itself
          sudo -u postgres psql -c "CREATE ROLE rail8 LOGIN CREATEDB PASSWORD 'rail8';"
          sudo -u postgres psql -c "CREATE DATABASE rail8 OWNER rail8;"
      - name: Run the harness (bench/run.sh from P0-10; fails on a > 20 % regression once a baseline exists)
        run: |
          bench/run.sh
        env:
          BENCH_MACHINE: github-hosted runner   # compared only with a baseline of this label (D-037); VM numbers never apply here
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench/out/
          if-no-files-found: ignore

  mutation:
    name: mutation (PIT, api + core)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      # Scoped to api + core: -DskipTests would make pitest-maven skip silently, so tests are compiled
      # the normal way; the ≥ 80 % threshold (platform/pom.xml) fails the job below the floor.
      - name: PIT on api and core
        run: mvn -B -ntp -f platform/pom.xml -pl :rail8-api,:rail8-core -am test-compile org.pitest:pitest-maven:mutationCoverage
      - uses: actions/upload-artifact@v4
        with:
          name: pit-reports
          path: '**/target/pit-reports/**'
          if-no-files-found: ignore
