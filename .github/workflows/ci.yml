# The platform's checks on GitHub.
# On every change (a push to main, a pull request): the sign-off check of every commit, and the build with unit
# and integration tests on the pinned Postgres, Error Prone, the name guard, the change guard and the demo package.
# These block a merge.
# Once a night and on demand, as a report that blocks nothing: the whole stack in Docker with the demo deployed,
# the same tests on the oldest supported Postgres, the coverage floors and the "coverage must not fall"
# comparison, the benchmark and mutation testing.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'

env:
  JAVA_VERSION: '25'
  MAVEN_OPTS: -Xmx3g

jobs:
  dco:
    name: DCO sign-off on every commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            range="${{ github.event.before }}..${{ github.sha }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            # the checkout is the synthetic merge commit, which carries no sign-off
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            range="HEAD~1..HEAD"
          fi
          missing=0
          # Only the commits on the first-parent line are checked, merge commits included. The commits a merge
          # brings in through its second parent are not: the imported mapping engine has 131 commits without
          # the trailer.
          for c in $(git rev-list --first-parent "$range"); do
            if ! git log -n 1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "::error::commit $c has no Signed-off-by trailer"; missing=1
            fi
          done
          [ "$missing" = 0 ]

  build:
    name: "build · unit · integration (-Pit) · ArchUnit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # References to tasks or decisions in comments, and colours written by hand instead of PatternFly tokens, on
      # the lines this change adds or modifies: compared with the pull request's base, with the previous main for
      # a push, else with the parent commit. In the folders whose comments have been cleaned (CLEANED in
      # ci/change_guard.py) every comment is checked for references, changed or not.
      - name: Change guard on the added and modified lines, and its tests
        run: |
          set -euo pipefail
          python3 -m unittest ci.test_change_guard
          base=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base="${{ github.event.before }}"
          fi
          if [ -n "$base" ]; then
            git fetch -q --no-tags --depth=1 origin "$base"
          else
            git fetch -q --no-tags --deepen=1 origin "$GITHUB_SHA"
            base="HEAD~1"
          fi
          python3 ci/change_guard.py --base "$base"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Install the jq engine the jq step depends on (its tests run in jq-ci)
        run: bin/install-jq
      # jacoco.skip: coverage is measured only in the nightly coverage job, so a fall in coverage never blocks a change.
      # -T 1C: modules that do not depend on each other build at the same time; inside a module the test classes are spread
      # over one test JVM per core (rail8.test.forks in platform/pom.xml).
      - name: Verify (unit tests, integration tests with Testcontainers, ArchUnit)
        run: mvn -B -ntp -T 1C -f platform/pom.xml verify -Pit -Djacoco.skip=true
      - name: The demo package validates through the launcher
        run: bin/rail8 validate examples/demo
      - name: The demo package's flow tests pass through the launcher
        run: bin/rail8 test examples/demo
      - name: Script tests (coverage check, name guard, comment-only check, site checks) and the name guard itself
        run: |
          set -euo pipefail
          python3 -m unittest ci.test_coverage_check
          python3 -m unittest ci.test_comment_only_check
          python3 -m unittest ci.test_name_guard
          python3 ci/name_guard.py
          python3 -m unittest ci.test_site
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
          if-no-files-found: ignore

  postgres-floor:
    name: "nightly · unit · integration (-Pit) · Postgres 17.11, the oldest supported"
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Install the jq engine the jq step depends on (its tests run in jq-ci)
        run: bin/install-jq
      - name: Verify on Postgres 17.11
        run: mvn -B -ntp -f platform/pom.xml verify -Pit -Djacoco.skip=true -Drail8.it.postgres=postgres:17.11

  coverage:
    name: "nightly · coverage floors and the comparison with ci/coverage-baseline.json"
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Install the jq engine the jq step depends on (its tests run in jq-ci)
        run: bin/install-jq
      # The floors of platform/pom.xml (90 % for api and core, 75 % elsewhere) fail this job when missed.
      - name: Verify with the coverage floors
        run: mvn -B -ntp -f platform/pom.xml verify -Pit
      # Compares this night's coverage with the committed ci/coverage-baseline.json and reports any fall.
      - name: Coverage compared with the committed baseline
        if: always()
        run: python3 ci/coverage_check.py --baseline-ref HEAD
      - name: Coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: '**/target/site/jacoco/jacoco.xml'
          if-no-files-found: ignore

  stack:
    name: "nightly · stack (deploy/compose: up, /health within 60 s, deploy exit 0, demo listed)"
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    env:
      RAIL8_ADMIN_TOKEN: ci-stack-token
      RAIL8_S3_SECRET_KEY: ci-stack-s3-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Install the jq engine the jq step depends on (its tests run in jq-ci)
        run: bin/install-jq
      - name: Build the jars the node image and the deploy one-shot use
        run: mvn -B -ntp -q -f platform/pom.xml package -DskipTests -pl :rail8-runtime,:rail8-cli -am
      - name: Start the stack and wait for /health (60 s bound)
        working-directory: deploy/compose
        run: |
          set -euo pipefail
          docker compose up -d --build
          start=$(date +%s)
          until curl -sf localhost:8081/health > /dev/null; do
            if [ $(( $(date +%s) - start )) -ge 60 ]; then echo "::error::/health not green within 60 s of up"; exit 1; fi
            sleep 1
          done
          echo "seconds from up to /health green: $(( $(date +%s) - start ))"
      - name: The deploy one-shot exited 0 and the demo is listed
        working-directory: deploy/compose
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            [ "$(docker compose ps -a deploy --format '{{.State}}')" = exited ] && break
            sleep 1
          done
          code=$(docker compose ps -a deploy --format '{{.ExitCode}}')
          [ "$code" = 0 ] || { echo "::error::deploy exited $code"; docker compose logs deploy; exit 1; }
          curl -sf -H "Authorization: Bearer $RAIL8_ADMIN_TOKEN" localhost:8081/admin/packages | grep -q '"name":"demo"'
      - name: Stack logs on failure
        if: failure()
        working-directory: deploy/compose
        run: docker compose logs --no-color | tail -200
      - name: Tear down
        if: always()
        working-directory: deploy/compose
        run: docker compose --profile history --profile kafka down -v

  bench:
    name: bench (native Postgres on the runner)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Start native Postgres
        # the runner's packaged Postgres, deliberately not pinned to PostgresImage (D-129): its version is recorded with the
        # numbers in bench/RESULTS.md; the bench ITs in the build job run on the pinned image
        run: |
          sudo systemctl start postgresql
          # CREATEDB: bench/run.sh creates the rail8_bench database itself
          sudo -u postgres psql -c "CREATE ROLE rail8 LOGIN CREATEDB PASSWORD 'rail8';"
          sudo -u postgres psql -c "CREATE DATABASE rail8 OWNER rail8;"
      - name: Run the harness (bench/run.sh from P0-10; fails on a > 20 % regression once a baseline exists)
        run: |
          bench/run.sh
        env:
          BENCH_MACHINE: github-hosted runner   # compared only with a baseline of this label (D-037); VM numbers never apply here
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench/out/
          if-no-files-found: ignore

  mutation:
    name: mutation (PIT, api + core)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      # Scoped to api + core: -DskipTests would make pitest-maven skip silently, so tests are compiled
      # the normal way; the ≥ 80 % threshold (platform/pom.xml) fails the job below the floor.
      - name: PIT on api and core
        run: mvn -B -ntp -f platform/pom.xml -pl :rail8-api,:rail8-core -am test-compile org.pitest:pitest-maven:mutationCoverage
      - uses: actions/upload-artifact@v4
        with:
          name: pit-reports
          path: '**/target/pit-reports/**'
          if-no-files-found: ignore
