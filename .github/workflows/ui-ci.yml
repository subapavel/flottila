name: ui-ci

# The Rail8 web application (ui/) on every change to it: licences of every npm package, type check, lint, unit tests,
# component tests in Chromium and the production build. The platform's ci.yml checks the sign-off of every commit.
on:
  pull_request:
    paths:
      - 'ui/**'
      - 'mapping/ui/scripts/check-licences.mjs'
      - 'mapping/ui/scripts/licence-exceptions.json'
      - '.github/workflows/ui-ci.yml'
  push:
    branches: [main]
    paths:
      - 'ui/**'
      - 'mapping/ui/scripts/check-licences.mjs'
      - 'mapping/ui/scripts/licence-exceptions.json'
      - '.github/workflows/ui-ci.yml'

concurrency:
  group: ui-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui:
    name: ui
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      # The licence list of AGENTS.md, with the dev-only exceptions in mapping/ui/scripts/licence-exceptions.json.
      - name: Licences
        run: npm run licences
      # The pinned playwright devDependency decides the Chromium build.
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run test:browser
      - run: npm run build
