name: ui-ci

# The Rail8 web application (ui/) on every change to it: licences of every npm package, the generated types, type
# check, lint, unit tests, component tests in Chromium and the production build.
on:
  pull_request:
    paths:
      - 'ui/**'
      # the mapping studio's types are generated from the contract, and its fake service reads the corpus and the contract
      - 'mapping/corpus/**'
      - 'mapping/contract/**'
      - '.github/workflows/ui-ci.yml'
  push:
    branches: [main]
    paths:
      - 'ui/**'
      # the mapping studio's types are generated from the contract, and its fake service reads the corpus and the contract
      - 'mapping/corpus/**'
      - 'mapping/contract/**'
      - '.github/workflows/ui-ci.yml'

concurrency:
  group: ui-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui:
    name: ui
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      # Every npm package carries an allowed licence (Apache 2.0, MIT, BSD, ISC, MPL 2.0, EPL); a few dev-only build
      # tools are listed as exceptions.
      - name: Licences
        run: npm run licences
      # The pinned playwright devDependency decides the Chromium build.
      - run: npx playwright install --with-deps chromium
      # The mapping studio's types are generated from the mapping contract and committed; they must match it.
      - name: Generated types are up to date
        run: |
          npm run gen:types
          git diff --exit-code src/mapping/generated
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run test:browser
      - run: npm run build
      # The page under e2e/fake/ serves the end-to-end scenarios on the development server only.
      - name: The production build leaves out the development-only page
        run: |
          test ! -e dist/e2e
          ! grep -rqF 'fake mapping service' dist
