name: ui-ci

# The Rail8 web application (ui/): licences of every npm package, the generated types, type check, lint, unit tests,
# component tests in Chromium and the production build, and the end-to-end scenarios against the mapping service's jar.
# It runs once a day on main, before the owner's morning overview, and on demand; it has no pull request trigger, and
# the session that wrote a change builds locally before it merges.
on:
  schedule:
    - cron: '42 4 * * *'
  workflow_dispatch:

concurrency:
  group: ui-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui:
    name: ui
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      # Every npm package carries an allowed licence (Apache 2.0, MIT, BSD, ISC, MPL 2.0, EPL); a few dev-only build
      # tools are listed as exceptions.
      - name: Licences
        run: npm run licences
      # The pinned playwright devDependency decides the Chromium build.
      - run: npx playwright install --with-deps chromium
      # The mapping studio's types are generated from the mapping contract and committed; they must match it.
      - name: Generated types are up to date
        run: |
          npm run gen:types
          git diff --exit-code src/mapping/generated
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run test:browser
      - run: npm run build
      # The page under e2e/fake/ serves the end-to-end scenarios on the development server only.
      - name: The production build leaves out the development-only page
        run: |
          test ! -e dist/e2e
          ! grep -rqF 'fake mapping service' dist

  # The mapping service's jar started over a copy of the corpus, and the @stack scenarios of the UI against it.
  stack:
    name: ui · stack
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mapping
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: 'mapping/**/pom.xml'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Maven mirror
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings>
            <mirrors>
              <mirror>
                <id>google-maven-central</id>
                <mirrorOf>central</mirrorOf>
                <url>https://maven-central.storage-download.googleapis.com/maven2</url>
              </mirror>
            </mirrors>
          </settings>
          EOF
      - name: The service's jar
        run: ../mvnw -B -pl service -am package -DskipTests
      - name: Playwright
        working-directory: ui
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: '@stack scenarios against the service'
        working-directory: ui
        run: npm run e2e:stack
