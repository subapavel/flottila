name: mapping-nightly

# The mapping engine's nightly report; nothing here blocks a change.
# mutation: PIT on main over the nine class-C modules, failing below 80 % (ADR-0019), then the fresh result compared
#   with ratchet/mutation.tsv by scripts/ratchet-ci.sh nightly (a survivor count above its row, or a row without a
#   report, is a drop).
# coverage: the build with the coverage floors and the benchmarks, then scripts/ratchet-ci.sh push compares it with
#   the ratchet of the closest earlier commit whose push run of mapping-ci's backend job was green.
# windows: the whole reactor compiles on Windows (drive letters and backslashes in paths).
# ui-e2e and stack: the UI's end-to-end tests, then the jar with the UI inside and the @stack suite against it.
# A drop is reported until the date in scripts/ratchet-enforced-from and fails the job from that day; either way it
# only turns the nightly report red. It commits nothing.
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  MVNW_REPOURL: https://maven-central.storage-download.googleapis.com/maven2
  # MUTATION_MODULES of scripts/ratchet.java, named once (scripts/test/ratchet-ci-wiring-test.sh compares the two)
  PIT_MODULES: engine/xdm,engine/ir,engine/runtime,engine/serializer,engine/mapping,engine/xslt-export,engine/api,engine/udf-api,engine/udf

jobs:
  mutation:
    name: mapping · mutation
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mapping
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: 'mapping/**/pom.xml'
      - name: Maven mirror
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings>
            <mirrors>
              <mirror>
                <id>google-maven-central</id>
                <mirrorOf>central</mirrorOf>
                <url>https://maven-central.storage-download.googleapis.com/maven2</url>
              </mirror>
            </mirrors>
          </settings>
          EOF
      # -am: upstream modules join the reactor; modules without a mutation floor set pit.skip.
      # Modules without production code set failWhenNoMutations=false until their first ticket removes it.
      - name: PIT
        run: >
          ../mvnw -B
          -pl "$PIT_MODULES"
          -am test-compile org.pitest:pitest-maven:mutationCoverage
      # also after a failed PIT step: a module without its report is a drop
      - name: Mutation ratchet against ratchet/mutation.tsv
        if: always()
        run: scripts/ratchet-ci.sh nightly
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pit-reports
          path: mapping/engine/*/target/pit-reports
          if-no-files-found: ignore

  coverage:
    name: mapping · coverage
    runs-on: ubuntu-24.04
    # actions: read lets the ratchet's lookup read mapping-ci's runs and their jobs
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: mapping
    steps:
      # the whole history: the ratchet's lookup walks HEAD's ancestors
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: 'mapping/**/pom.xml'
      - name: Maven mirror
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings>
            <mirrors>
              <mirror>
                <id>google-maven-central</id>
                <mirrorOf>central</mirrorOf>
                <url>https://maven-central.storage-download.googleapis.com/maven2</url>
              </mirror>
            </mirrors>
          </settings>
          EOF
      - name: Build, test, coverage floors, benchmarks
        run: ../mvnw -B -Pbench verify
      # The last step: it reads the build's reports. The lookup finds the baseline through GitHub's API with the
      # run's own token, then ratchet.java check holds this build against it.
      - name: Ratchet check against the baseline
        env:
          GH_TOKEN: ${{ github.token }}
          RATCHET_BASELINE_SHA: ${{ github.event.pull_request.base.sha }}
        run: scripts/ratchet-ci.sh push

  # The owner builds on Windows (#42): drive letters and backslashes in paths. Ticket-gate row 2.
  windows:
    name: mapping · windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mapping
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: 'mapping/**/pom.xml'
      - name: Maven mirror
        shell: bash
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings>
            <mirrors>
              <mirror>
                <id>google-maven-central</id>
                <mirrorOf>central</mirrorOf>
                <url>https://maven-central.storage-download.googleapis.com/maven2</url>
              </mirror>
            </mirrors>
          </settings>
          EOF
      - name: Whole reactor compiles; Spotless, enforcer, licences
        run: ../mvnw.cmd -B -q -DskipTests verify

  # The UI's end-to-end tests, and the built UI for the stack job below.
  ui-e2e:
    name: mapping · ui end-to-end
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mapping/ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mapping/ui/package-lock.json
      - run: npm ci
      # The pinned @playwright/test (1.63.0) decides the Chromium build.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: mapping/ui/dist
          if-no-files-found: error

  # The jar with the UI inside, started and tested end to end (the @stack suite).
  stack:
    name: mapping · stack
    needs: ui-e2e
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mapping
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: 'mapping/**/pom.xml'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mapping/ui/package-lock.json
      - name: Maven mirror
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings>
            <mirrors>
              <mirror>
                <id>google-maven-central</id>
                <mirrorOf>central</mirrorOf>
                <url>https://maven-central.storage-download.googleapis.com/maven2</url>
              </mirror>
            </mirrors>
          </settings>
          EOF
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: mapping/ui/dist
      - name: Jar with the UI inside
        run: ../mvnw -B -Pui -pl service -am package -DskipTests
      - name: Playwright
        working-directory: mapping/ui
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: '@stack suite against the jar'
        working-directory: mapping/ui
        run: npm run e2e:stack
