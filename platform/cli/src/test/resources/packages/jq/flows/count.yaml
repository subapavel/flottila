# A recursion that is not a tail call holds one live activation per level: 15 000 levels pass only with the flow's own depth.
schemaVersion: 1
kind: flow
id: count
version: 0.1.0
description: Count down recursively with jq and send the count.
from:
  endpoint: in-count
delivery:
  mode: sync
recording:
  level: all
  payload: keep
limits:
  maxBodyBytes: 1048576
steps:
  - type: jq
    name: count
    filter: 'def f: if . == 0 then 0 else (. - 1 | f) + 1 end; f'
    maxRecursionDepth: 20000
  - type: to
    name: partner
    endpoint: partner
