schemaVersion: 1
kind: test
flow: count
mocks:
  partner: { reply: fixtures/ack.json }
cases:
  - name: deeper than the default
    send: fixtures/fifteen-thousand.json
    expect:
      status: 200
      sent:
        partner: { count: 1, equals: '15000' }
  - name: deeper than the flow's depth
    send: fixtures/thirty-thousand.json
    expect:
      status: 500
      sent:
        partner: { count: 0 }
