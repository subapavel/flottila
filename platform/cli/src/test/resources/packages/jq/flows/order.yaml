# The order's id and total, computed by jq, go to the partner; the sender's answer is the partner's reply.
schemaVersion: 1
kind: flow
id: order
version: 0.1.0
description: Map an order for the partner with jq and send it.
from:
  endpoint: in-order
delivery:
  mode: sync
recording:
  level: all
  payload: keep
limits:
  maxBodyBytes: 1048576
steps:
  - type: jq
    name: toPartner
    filter: '{id: .order.id, customer: .order.customer, total: (.items | map(.price * .qty) | add)}'
  - type: to
    name: partner
    endpoint: partner
