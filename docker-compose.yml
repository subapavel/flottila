# The local quickstart (docs/QUICKSTART.md): Postgres, one Flottila node and the demo's partner echo. Build the runtime on the
# host first: mvn -B -ntp -q package -DskipTests -pl flottila-runtime -am. The node migrates the schema itself (Flyway).
# Postgres is also published on loopback (127.0.0.1:5432, or FLOTTILA_PG_HOST_PORT) for psql and local tools. The database and
# the node's data directory (its deployment archives) live in named volumes: `docker compose down -v` removes both together.
services:
  postgres:
    image: postgres:18.6
    container_name: flottila-postgres
    environment:
      POSTGRES_DB: flottila
      POSTGRES_USER: flottila
      POSTGRES_PASSWORD: flottila
    ports:
      - "127.0.0.1:${FLOTTILA_PG_HOST_PORT:-5432}:5432"
    volumes:
      # the 18 image keeps PGDATA at /var/lib/postgresql/18/docker and refuses a mount at .../data; a 16/17 volume is not reused
      - flottila-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flottila -d flottila"]
      interval: 2s
      timeout: 2s
      retries: 15

  netns:
    # holds the network namespace of the node and the echo: either can die and come back without the other losing localhost
    image: eclipse-temurin:25.0.4.1_1-jre-noble
    command: ["sleep", "infinity"]
    networks:
      default:
        aliases:
          - flottila
    ports:
      - "127.0.0.1:8080:8080"   # the demo's http-in
      - "127.0.0.1:8081:8081"   # admin API and /health
    healthcheck:
      test: ["CMD", "true"]
      interval: 2s
      timeout: 2s
      retries: 30

  flottila:
    network_mode: "service:netns"
    build:
      context: .
      dockerfile: deploy/quickstart/Dockerfile
    image: flottila-quickstart:local
    environment:
      FLOTTILA_ENV: dev
      FLOTTILA_NODE_ID: quickstart
      # the body journal's master key, generated once into <data dir>/journal/MASTER beside the data it protects: a dev stack of
      # one node only; the node logs a WARNING about it at every start (D-106). Any other node takes FLOTTILA_JOURNAL_KEY_FILE
      FLOTTILA_JOURNAL_KEY_GENERATE: "true"
      FLOTTILA_PG_HOST: postgres
      FLOTTILA_PG_PASSWORD: flottila
      # the stack's own network reaches Postgres as 'postgres', which defaults to verify-full: this dev stack's Postgres serves no
      # TLS, so its plaintext link is written down here (D-124); a deployed node sets verify-full and FLOTTILA_PG_SSL_ROOT_CERT
      FLOTTILA_PG_SSL_MODE: disable
      FLOTTILA_ADMIN_HOST: 0.0.0.0
      # an admin API off loopback needs a token: the node refuses to start without one (export it, docs/QUICKSTART.md)
      FLOTTILA_ADMIN_TOKEN: ${FLOTTILA_ADMIN_TOKEN:-}
      # the demo's sftp-inbox names its password and host key as secret:// references, so the node needs both to deploy the demo. This
      # stack has no SFTP server: placeholders (a well-formed fake fingerprint); that endpoint cannot connect, the sync flow is unaffected
      # (the working SFTP flow is in deploy/compose)
      FLOTTILA_SECRET_SFTP_PASSWORD: placeholder
      FLOTTILA_SECRET_SFTP_HOST_KEY: "SHA256:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
    depends_on:
      netns:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - flottila-data:/var/lib/flottila   # a restart restores the deployed packages from the archives here
    healthcheck:
      # the image has no curl: one HTTP/1.0 request over bash's /dev/tcp, healthy on a 200
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 2s
      timeout: 2s
      retries: 30

  echo:
    # the demo's partner on localhost:8090 of the node: the JDK echo in the node's network namespace (the source launcher needs
    # the JDK image, not the JRE); the demo package is deployed unchanged
    image: eclipse-temurin:25.0.4.1_1-jdk-noble
    user: ubuntu
    network_mode: "service:netns"
    volumes:
      - ./deploy/quickstart/PartnerEcho.java:/opt/echo/PartnerEcho.java:ro
    command: ["java", "/opt/echo/PartnerEcho.java", "8090"]
    depends_on:
      netns:
        condition: service_healthy
      flottila:
        condition: service_healthy

volumes:
  flottila-pg:
  flottila-data:
