services:
  postgres:
    image: postgres:16
    container_name: flottila-postgres
    environment:
      POSTGRES_DB: flottila
      POSTGRES_USER: flottila
      POSTGRES_PASSWORD: flottila
    ports:
      - "5432:5432"
    volumes:
      - ./deploy/postgres/V1__m1_schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flottila -d flottila"]
      interval: 2s
      timeout: 2s
      retries: 15
