# The local quickstart (docs/QUICKSTART.md): Postgres, one Rail8 node, the demo's partner echo and an SFTP server for the demo's inbox. Build the runtime on the
# host first: ./mvnw -B -ntp -q package -DskipTests -pl :rail8-node -am. The node migrates the schema itself (Flyway).
# Postgres is also published on loopback (127.0.0.1:5432, or RAIL8_PG_HOST_PORT) for psql and local tools. The database and
# the node's data directory (its deployment archives) live in named volumes: `docker compose down -v` removes both together.
services:
  postgres:
    image: postgres:18.6
    container_name: rail8-postgres
    environment:
      POSTGRES_DB: rail8
      POSTGRES_USER: rail8
      POSTGRES_PASSWORD: rail8
    ports:
      - "127.0.0.1:${RAIL8_PG_HOST_PORT:-5432}:5432"
    volumes:
      # the 18 image keeps PGDATA at /var/lib/postgresql/18/docker and refuses a mount at .../data; a 16/17 volume is not reused
      - rail8-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rail8 -d rail8"]
      interval: 2s
      timeout: 2s
      retries: 15

  netns:
    # holds the network namespace of the node and the echo: either can die and come back without the other losing localhost
    image: eclipse-temurin:25.0.4.1_1-jre-noble
    command: ["sleep", "infinity"]
    networks:
      default:
        aliases:
          - rail8
    ports:
      - "127.0.0.1:8080:8080"   # the demo's http-in
      - "127.0.0.1:8084:8084"   # the demo's http-in-order
      - "127.0.0.1:8081:8081"   # admin API and /health
      - "127.0.0.1:8082:8082"   # the demo's http-in-async (/invoice/async)
    healthcheck:
      test: ["CMD", "true"]
      interval: 2s
      timeout: 2s
      retries: 30

  rail8:
    network_mode: "service:netns"
    build:
      context: .
      dockerfile: deploy/quickstart/Dockerfile
    image: rail8-quickstart:local
    environment:
      RAIL8_ENV: dev
      RAIL8_NODE_ID: quickstart
      # the body journal's master key, generated once into <data dir>/journal/MASTER beside the data it protects: a dev stack of
      # one node only; the node logs a WARNING about it at every start (D-106). Any other node takes RAIL8_JOURNAL_KEY_FILE
      RAIL8_JOURNAL_KEY_GENERATE: "true"
      RAIL8_PG_HOST: postgres
      RAIL8_PG_PASSWORD: rail8
      # the stack's own network reaches Postgres as 'postgres', which defaults to verify-full: this dev stack's Postgres serves no
      # TLS, so its plaintext link is written down here (D-124); a deployed node sets verify-full and RAIL8_PG_SSL_ROOT_CERT
      RAIL8_PG_SSL_MODE: disable
      RAIL8_ADMIN_HOST: 0.0.0.0
      # an admin API off loopback needs a token: the node refuses to start without one (export it, docs/QUICKSTART.md)
      RAIL8_ADMIN_TOKEN: ${RAIL8_ADMIN_TOKEN:-}
      # the demo's sftp-inbox names its password and host key as secret:// references (the stack's `sftp` server, user demo); the host
      # key's fingerprint is generated by the `sftp-keys` one-shot, nothing secret or generated is in the repo
      RAIL8_SECRET_SFTP_PASSWORD: "${RAIL8_SFTP_PASSWORD:-demo}"
    # the image's own command, behind a wrapper that reads the fingerprint `sftp-keys` wrote (public, unknown until the key exists)
    entrypoint:
      - sh
      - -c
      - 'RAIL8_SECRET_SFTP_HOST_KEY=$$(cat /sftp-fingerprint/host-key.fingerprint) && export RAIL8_SECRET_SFTP_HOST_KEY && exec java -jar /opt/rail8/rail8-node.jar'
    depends_on:
      netns:
        condition: service_healthy
      sftp-keys:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - sftp-fingerprint:/sftp-fingerprint:ro
      - rail8-data:/var/lib/rail8   # a restart restores the deployed packages from the archives here
    healthcheck:
      # the image has no curl: one HTTP/1.0 request over bash's /dev/tcp, healthy on a 200
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 2s
      timeout: 2s
      retries: 30

  echo:
    # the demo's partner on localhost:8090 of the node: the JDK echo in the node's network namespace (the source launcher needs
    # the JDK image, not the JRE); the demo package is deployed unchanged
    image: eclipse-temurin:25.0.4.1_1-jdk-noble
    user: ubuntu
    network_mode: "service:netns"
    volumes:
      - ./deploy/quickstart/PartnerEcho.java:/opt/echo/PartnerEcho.java:ro
    command: ["java", "/opt/echo/PartnerEcho.java", "8090"]
    depends_on:
      netns:
        condition: service_healthy
      rail8:
        condition: service_healthy

  sftp-keys:
    # one-shot: generates the SFTP server's RSA host key (3072 bits) into the sftp-hostkeys volume, only when it is not there yet (a
    # second `up` keeps the key the server already presented), and writes the SHA256 fingerprint of its public half, which is public,
    # to host-key.fingerprint in the separate volume sftp-fingerprint: the node mounts only that one, read-only, and reads the file into
    # RAIL8_SECRET_SFTP_HOST_KEY; no path holding a host key reaches it. It exits non-zero when the fingerprint file is empty. RSA
    # because the node's SFTP client (Apache MINA SSHD 2.20 as shipped) does not offer ssh-ed25519 (observed). Same pinned
    # image as `sftp` (it ships ssh-keygen).
    image: atmoz/sftp:alpine@sha256:43dd1c023cf1bae487127d4b54660b0aee6e94c188a6599be36fb89ba115f961
    restart: "no"
    volumes:
      - sftp-hostkeys:/keys
      - sftp-fingerprint:/fingerprint
    entrypoint:
      - sh
      - -c
      - |
        set -e
        if [ ! -s /keys/ssh_host_rsa_key ]; then ssh-keygen -q -t rsa -b 3072 -N '' -f /keys/ssh_host_rsa_key; fi
        ssh-keygen -l -f /keys/ssh_host_rsa_key.pub | awk '{print $$2}' > /fingerprint/host-key.fingerprint
        chmod 644 /fingerprint/host-key.fingerprint
        [ -s /fingerprint/host-key.fingerprint ]

  sftp:
    # user demo, directory inbox. The host key is the RSA one `sftp-keys` generated: only the key file is mounted (a volume over
    # /etc/ssh would shadow the image's sshd_config); the image makes its own ed25519 key, which the node's client never negotiates. The wrapper hands the inbox volume (root-owned when mounted) to the user demo,
    # uid 1001, so that it can delete a delivered file. docs/QUICKSTART.md: how to drop a file.
    # The tag is a moving one upstream, so the image is pinned by digest.
    image: atmoz/sftp:alpine@sha256:43dd1c023cf1bae487127d4b54660b0aee6e94c188a6599be36fb89ba115f961
    entrypoint:
      - sh
      - -c
      - 'chown 1001:100 /home/demo/inbox && exec /entrypoint "$$@"'
      - sftp
    command: ["demo:${RAIL8_SFTP_PASSWORD:-demo}:1001:100:inbox"]
    volumes:
      - type: volume
        source: sftp-hostkeys
        target: /etc/ssh/ssh_host_rsa_key
        read_only: true
        volume:
          subpath: ssh_host_rsa_key
      - sftp-data:/home/demo/inbox
    depends_on:
      sftp-keys:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 22"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  rail8-pg:
  rail8-data:
  sftp-hostkeys:
  sftp-fingerprint:
  sftp-data:
